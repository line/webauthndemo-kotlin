#
# WebAuthn Demo Kotlin - Production Configuration
# Compatible with LINE Android V2 build environment
#
# Project-wide Gradle settings aligned with LINE Android standards
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#

###############################################################################
# Build Performance & Memory Settings
###############################################################################

# JVM arguments optimized for production build environment
# Aligned with LINE Android V2 memory requirements
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2g"

# Enable advanced Gradle features for better performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Configuration cache for faster builds (LINE Android V2 compatible)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# Java toolchain settings
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

###############################################################################
# Android Configuration
###############################################################################

# Android X and modern Android features
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.uniquePackageNames=true

# Default build features (disabled for performance)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# R8 optimization settings
android.enableR8.fullMode=false

###############################################################################
# Kotlin Configuration
###############################################################################

# Kotlin code style and compiler settings
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# KSP settings for better performance
ksp.useKSP2=false

###############################################################################
# Version Management
###############################################################################

# Core framework versions aligned with LINE Android V2
kotlinVersion=2.2.10
androidGradlePluginVersion=8.12.1
kspVersion=2.2.10-2.0.2

# Android SDK versions
compileSdkVersion=35
targetSdkVersion=35
minSdkVersion=28

# Dependency versions
coreVersion=1.15.0
appcompatVersion=1.7.0
materialVersion=1.13.0
constraintLayoutVersion=2.2.0
lifecycleVersion=2.8.7
navigationVersion=2.8.4
roomVersion=2.6.1
kotlinxCoroutinesVersion=1.10.2
kotlinxSerializationVersion=1.8.1
biometricVersion=1.2.0-alpha05
gsonVersion=2.11.0

# Testing libraries
junitVersion=4.13.2
junit5Version=5.11.4
testExtJunitVersion=1.2.1
espressoVersion=3.6.1
mockkVersion=4.0.2
truthVersion=1.4.4

# Build tools
ktlintVersion=13.1.0